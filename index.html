<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموقع تحت الإنشاء</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Tahoma", sans-serif;
}

body{
    background: linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:40px;
}

.icon{
    font-size:80px;
    animation:rotate 3s linear infinite;
}

h1{
    margin-top:20px;
    font-size:42px;
}

p{
    margin-top:15px;
    font-size:20px;
    color:#d1d5db;
}

.loader{
    width:280px;
    height:10px;
    background:rgba(255,255,255,.2);
    border-radius:20px;
    margin:40px auto;
    overflow:hidden;
}

.loader span{
    display:block;
    width:40%;
    height:100%;
    background:#38bdf8;
    border-radius:20px;
    animation:loading 2s infinite ease-in-out;
}

footer{
    margin-top:20px;
    color:#94a3b8;
    font-size:14px;
}

@keyframes loading{
    0%{
        transform:translateX(-100%);
    }
    100%{
        transform:translateX(300%);
    }
}

@keyframes rotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
</style>

</head>
<body>

<div class="container">

<div class="icon">⚙️</div>

<h1>🚧 الموقع تحت الإنشاء</h1>

<p>
نعمل حالياً على تطوير الموقع وإضافة محتوى جديد.<br>
شكراً لصبركم، وسنعود قريباً بإذن الله.
</p>

<div class="loader">
<span></span>
</div>

<footer>
© 2026 جميع الحقوق محفوظة
</footer>

</div>

</body>
</html>
